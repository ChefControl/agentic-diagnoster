name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Fast checks with no cluster: lint, types, unit tests, production build.
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Lint cluster.sh
        working-directory: .
        run: shellcheck cluster.sh
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # The agent's own unit tests. No model calls, so no API key needed.
  agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: agent/uv.lock
      - run: uv run --locked pytest --ignore=tests/test_evaluators.py --ignore=tests/test_real_replies.py --ignore=tests/test_setup.py

  # The evals, without a model: the code evaluators grade the agent's real
  # replies from an eval run (tests/replies/) and hand-written failing ones,
  # the answer keys build a valid dataset, and the Phoenix setup is checked
  # against a fake Phoenix. The action judge needs a model; it runs in Phoenix.
  evals:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: agent/uv.lock
      - name: Code evaluators on real agent replies
        run: uv run --locked pytest -v tests/test_real_replies.py
      - name: Evaluators, answer keys and dataset
        run: uv run --locked pytest tests/test_evaluators.py tests/test_setup.py

  # The containers build, and start cleanly with nothing around them: the
  # agent on the recorded cluster with no API key (a question then fails with
  # a 502 that names the missing key), the UI with no cluster.
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the agent image
        run: docker build -t diagnoster-agent:ci -f agent/Dockerfile .
      - name: Build the UI image
        run: docker build -t diagnoster-ui:ci -f ui/Dockerfile .
      - name: The agent starts and fails cleanly without a key
        run: |
          docker run -d --name agent -e CLUSTER_MODE=recorded -p 8000:8000 diagnoster-agent:ci
          curl -fsS --retry 15 --retry-delay 1 --retry-all-errors localhost:8000/healthz | grep -q '"cluster":"recorded"'
          code=$(curl -s -o reply.json -w '%{http_code}' -X POST localhost:8000/v1/runs \
            -H 'content-type: application/json' -d '{"question":"Is anything wrong in namespace shop?"}')
          cat reply.json
          test "$code" = 502 && grep -q OPENAI_API_KEY reply.json
      - name: The UI starts without a cluster
        run: |
          docker run -d --name ui -e SCENARIO_MANAGER_KUBECONFIG=/nonexistent -p 8787:8787 diagnoster-ui:ci
          curl -fsS --retry 15 --retry-delay 1 --retry-all-errors localhost:8787/api/health | grep -q '"reachable":false'
          curl -fsS localhost:8787/ | grep -q '<div id="root">'
      - name: Container logs
        if: failure()
        run: docker logs agent; docker logs ui

  # Did this PR touch anything the cluster job checks? It takes ~1.5 min, so a
  # PR that only changes the agent or the chat skips it.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      cluster: ${{ steps.filter.outputs.cluster }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            cluster:
              - cluster.sh
              - cluster/**
              - rbac/**
              - scenarios/**
              - ui/src/server/**
              - ui/package.json
              - ui/package-lock.json
              - agent/src/diagnoster/remediation.py
              - agent/src/diagnoster/cluster.py
              - .github/workflows/ci.yml

  # Proves the safety boundary holds, every failure scenario still reproduces
  # (with the same code the UI uses), and the one fix really applies and
  # verifies as the remediator. No LLM involved.
  # Always on main and when run by hand; on a PR, only when `changes` says so.
  cluster:
    needs: [build, changes]
    if: ${{ !cancelled() && needs.build.result == 'success' && (github.event_name != 'pull_request' || needs.changes.outputs.cluster == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: agent/uv.lock
      - name: Install kind
        run: |
          curl -fsSLo kind https://kind.sigs.k8s.io/dl/v0.32.0/kind-linux-amd64
          echo "50030de23cf40a18505f20426f6a8506bedf13c6e509244bd1fa9463721b0f54  kind" | sha256sum -c -
          chmod +x kind && sudo mv kind /usr/local/bin/kind
      - name: Create cluster and verify permissions
        run: ./cluster.sh --up
      - run: npm ci
        working-directory: ui
      - name: Deploy every scenario as the UI's identity
        working-directory: ui
        run: npm run scenarios -- deploy all
      - name: Check every scenario reproduced
        working-directory: ui
        run: npm run scenarios -- check all --wait 180
      # RBAC lets the remediator patch payments-api; the admission policy lets
      # that patch touch only the readiness probe path. Server-side dry runs:
      # admission runs, nothing is stored.
      - name: The remediator may change the probe path and nothing else
        run: |
          r() { kubectl --kubeconfig .kube/remediator.kubeconfig -n payments patch deployment payments-api --dry-run=server -p "$1"; }
          r '{"spec":{"template":{"spec":{"containers":[{"name":"api","readinessProbe":{"httpGet":{"path":"/health"}}}]}}}}'
          for change in \
            '{"spec":{"template":{"spec":{"containers":[{"name":"api","image":"busybox:1.36"}]}}}}' \
            '{"spec":{"template":{"spec":{"containers":[{"name":"api","readinessProbe":{"httpGet":{"port":80}}}]}}}}' \
            '{"spec":{"template":{"spec":{"hostNetwork":true}}}}' \
            '{"metadata":{"labels":{"owner":"agent"}}}'; do
            if out=$(r "$change" 2>&1); then echo "allowed, should be denied: $change"; exit 1; fi
            echo "$out" | grep -q diagnoster-remediator-probe-path-only || { echo "denied for another reason: $out"; exit 1; }
          done
      - name: The approved fix applies and verifies with fresh reads
        working-directory: agent
        run: |
          uv run --locked python - <<'PY'
          from pathlib import Path
          from diagnoster.cluster import connect
          from diagnoster.contract import Diagnosis
          from diagnoster.remediation import fix

          kube = Path("../.kube")
          diagnosis = Diagnosis.model_validate({
              "root_cause": {"category": "bad_probe", "resource": "deployment/payments-api", "explanation": "CI"},
              "evidence": [{"fact": "CI", "tool_call_ids": ["tc_1"]}],
              "next_action": {"summary": "CI", "kind": "remediate", "proposed_fix": {
                  "target": "deployment/payments-api", "field": "readinessProbe.httpGet.path", "from": "/healthz", "to": "/health"}},
          })
          outcome = fix(diagnosis, remediator=lambda: connect(kube / "remediator.kubeconfig"), reader=lambda: connect(kube / "reader.kubeconfig"))
          print(outcome.status, outcome.detail)
          assert outcome.status == "fixed", outcome
          PY
      - name: Reset restores the broken state
        working-directory: ui
        run: |
          npm run scenarios -- reset bad-probe
          npm run scenarios -- check bad-probe --wait 120
      - name: Agent reader cannot read Secrets
        run: |
          if out=$(kubectl --kubeconfig .kube/reader.kubeconfig -n shop get secrets 2>&1); then echo "the reader read Secrets"; exit 1; fi
          echo "$out" | grep -q Forbidden || { echo "failed for another reason: $out"; exit 1; }
      - name: Dump cluster state
        if: failure()
        run: kubectl --context kind-diagnoster get all,events -A
