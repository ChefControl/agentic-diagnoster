# Namespace "shop": a healthy frontend and a checkout service that crash-loops.
# Root cause: the ConfigMap defines DB_URL, but checkout reads DATABASE_URL.
# Finding it needs three sources: pod state, previous logs and the ConfigMap.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: shop
spec:
  replicas: 1
  selector:
    matchLabels: {app: frontend}
  template:
    metadata:
      labels: {app: frontend}
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports: [{containerPort: 80}]
          readinessProbe:
            httpGet: {path: /, port: 80}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: shop
spec:
  selector: {app: frontend}
  ports: [{port: 80, targetPort: 80}]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: checkout-config
  namespace: shop
data:
  DB_URL: postgres://orders-db.shop:5432/checkout
  LOG_LEVEL: info
  PAYMENT_TIMEOUT_SECONDS: "30"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  namespace: shop
spec:
  replicas: 1
  selector:
    matchLabels: {app: checkout}
  template:
    metadata:
      labels: {app: checkout}
    spec:
      containers:
        - name: app
          image: busybox:1.36
          envFrom:
            - configMapRef: {name: checkout-config}
          command: ["sh", "-c"]
          args:
            - |
              echo "checkout-service v2.4.1 starting (log level: $LOG_LEVEL)"
              echo "loading database settings"
              if [ -z "$DATABASE_URL" ]; then
                echo "FATAL: DATABASE_URL is not set, cannot connect to database" >&2
                exit 1
              fi
              echo "connected to $DATABASE_URL"
              sleep infinity
          ports: [{containerPort: 8080}]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: checkout
  namespace: shop
spec:
  selector: {app: checkout}
  ports: [{port: 8080, targetPort: 8080}]
