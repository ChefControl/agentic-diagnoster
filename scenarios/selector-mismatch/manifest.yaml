# Namespace "catalog": the catalog pods are healthy, but the storefront can't
# reach them. Root cause: the Service selects app=catalog-api, while the pods
# are labeled app=catalog. Nothing is "red" on the pods themselves.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  namespace: catalog
spec:
  replicas: 2
  selector:
    matchLabels: {app: catalog}
  template:
    metadata:
      labels: {app: catalog, tier: backend}
    spec:
      containers:
        - name: api
          image: nginx:1.27-alpine
          ports: [{containerPort: 80}]
          readinessProbe:
            httpGet: {path: /, port: 80}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: catalog
  namespace: catalog
spec:
  selector: {app: catalog-api}
  ports: [{port: 80, targetPort: 80}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront
  namespace: catalog
spec:
  replicas: 1
  selector:
    matchLabels: {app: storefront}
  template:
    metadata:
      labels: {app: storefront, tier: frontend}
    spec:
      containers:
        - name: web
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              echo "storefront starting, upstream: http://catalog.catalog.svc.cluster.local"
              while true; do
                if wget -q -T 3 -O /dev/null http://catalog.catalog.svc.cluster.local/; then
                  echo "$(date -u +%FT%TZ) GET http://catalog/ -> 200"
                else
                  echo "$(date -u +%FT%TZ) ERROR: GET http://catalog/ failed: upstream unreachable"
                fi
                sleep 5
              done
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 32Mi}
