# Namespace "payments": payments-api runs but never becomes Ready, so its
# Service has no ready endpoints and receives no traffic.
# Root cause: the readiness probe checks /healthz, but the app serves /health.
# This is the scenario the agent may fix, after approval.
apiVersion: v1
kind: ConfigMap
metadata:
  name: payments-api-nginx
  namespace: payments
data:
  default.conf: |
    server {
      listen 8080;
      location = /health { return 200 "ok\n"; }
      location = /       { return 200 "payments-api v1.8.0\n"; }
      location /         { return 404; }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-api
  namespace: payments
spec:
  replicas: 2
  selector:
    matchLabels: {app: payments-api}
  template:
    metadata:
      labels: {app: payments-api}
    spec:
      containers:
        - name: api
          image: nginx:1.27-alpine
          ports: [{containerPort: 8080}]
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket: {port: 8080}
            periodSeconds: 10
          volumeMounts:
            - {name: nginx-conf, mountPath: /etc/nginx/conf.d}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
      volumes:
        - name: nginx-conf
          configMap: {name: payments-api-nginx}
---
apiVersion: v1
kind: Service
metadata:
  name: payments-api
  namespace: payments
spec:
  selector: {app: payments-api}
  ports: [{port: 80, targetPort: 8080}]
