# Namespace "inventory": nothing is broken. The correct diagnosis is
# "no fault found", which catches an agent that always invents a problem.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory
  namespace: inventory
spec:
  replicas: 2
  selector:
    matchLabels: {app: inventory}
  template:
    metadata:
      labels: {app: inventory}
    spec:
      containers:
        - name: api
          image: nginx:1.27-alpine
          ports: [{containerPort: 80}]
          readinessProbe:
            httpGet: {path: /, port: 80}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: inventory
  namespace: inventory
spec:
  selector: {app: inventory}
  ports: [{port: 80, targetPort: 80}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-sync
  namespace: inventory
spec:
  replicas: 1
  selector:
    matchLabels: {app: inventory-sync}
  template:
    metadata:
      labels: {app: inventory-sync}
    spec:
      containers:
        - name: sync
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              echo "inventory-sync starting, upstream: http://inventory.inventory.svc.cluster.local"
              while true; do
                if wget -q -T 3 -O /dev/null http://inventory.inventory.svc.cluster.local/; then
                  echo "$(date -u +%FT%TZ) sync ok"
                else
                  echo "$(date -u +%FT%TZ) ERROR: sync failed: upstream unreachable"
                fi
                sleep 5
              done
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 32Mi}
