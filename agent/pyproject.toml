[project]
name = "diagnoster-agent"
version = "0.1.0"
description = "The agent that investigates the cluster and returns a diagnosis backed by evidence"
requires-python = ">=3.12"
dependencies = [
    "kubernetes>=37.0.3",
    "openinference-instrumentation-pydantic-ai>=0.1.37",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "opentelemetry-sdk>=1.45.2",
    "pydantic>=2.14.3",
    "pydantic-ai-slim[anthropic,openai]>=2.70.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "starlette>=1.10.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
diagnose = "diagnoster.cli:main"
phoenix-setup = "diagnoster.evals.setup:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "diagnoster"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]
