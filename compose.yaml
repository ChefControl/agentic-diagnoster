# The UI, the agent and Phoenix, on kind's Docker network. Run ./cluster.sh --up first:
# kind creates that network, and cluster.sh writes the kubeconfigs in .kube/.
#
#   docker compose up -d --build
#
# UI:      http://localhost:8787
# Phoenix: http://localhost:6006  (traces, and the evals: see phoenix-setup)
# Agent:   http://localhost:8000  (OpenAI chat-completions format)

services:
  ui:
    build:
      context: .
      dockerfile: ui/Dockerfile
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      # The .internal kubeconfig reaches the API server by its container name,
      # which only resolves on the kind network.
      SCENARIO_MANAGER_KUBECONFIG: /kube/scenario-manager.internal.kubeconfig
      # The browser opens Phoenix on your machine; the API checks it by its
      # service name, because inside this container "localhost" is the container.
      PHOENIX_URL: http://localhost:6006
      PHOENIX_INTERNAL_URL: http://phoenix:6006
    # cluster.sh writes the kubeconfigs readable by you alone (chmod 600), so
    # the container runs as your user id. Shells don't export UID, so on Linux
    # run `UID=$(id -u) docker compose up -d --build`; Docker Desktop on a Mac
    # ignores file owners and the default works.
    user: "${UID:-1000}"
    volumes:
      # The whole folder, read-only: cluster.sh rewrites these files when it
      # issues fresh tokens, and the API rereads them on every request.
      - ./.kube:/kube:ro
      # Scenario edits take effect without rebuilding the image.
      - ./scenarios:/app/scenarios:ro
    networks: [kind]
    depends_on: [phoenix]
    restart: unless-stopped

  # The agent as an HTTP service. Phoenix calls it like a chat model, in
  # OpenAI's format (/v1/chat/completions) or Anthropic's (/v1/messages).
  # CLUSTER_MODE in .env picks the cluster: live (default) or recorded, a saved
  # snapshot of the four scenarios that needs no cluster.
  agent:
    build:
      context: .
      dockerfile: agent/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    # OPENAI_API_KEY and/or ANTHROPIC_API_KEY, and optionally MODEL and
    # CLUSTER_MODE. Without a key the service still starts, and each request
    # fails with a message naming the missing key.
    env_file:
      - path: .env
        required: false
    environment:
      READER_KUBECONFIG: /kube/reader.internal.kubeconfig
      # Loaded only by the remediation workflow, after a person approves the fix.
      REMEDIATOR_KUBECONFIG: /kube/remediator.internal.kubeconfig
      # Traces go to Phoenix by its service name; links in answers are for your browser.
      PHOENIX_COLLECTOR_ENDPOINT: http://phoenix:6006/v1/traces
      PHOENIX_URL: http://localhost:6006
      # Phoenix's Playground gives up on a model after 90 seconds, and an
      # experiment retries a call that timed out. The agent stops itself first,
      # so a slow run comes back as a "stopped: timeout" answer, once.
      RUN_TIMEOUT_S: "80"
    user: "${UID:-1000}"
    volumes:
      - ./.kube:/kube:ro
    networks: [kind]
    depends_on: [phoenix]
    restart: unless-stopped

  # Runs once after Phoenix starts and puts the evals into it: the agent in the
  # Playground's model menu (once per vendor whose key is set), the eval
  # dataset, the three evaluators, and the agent's prompt. Safe to run again:
  # `docker compose up phoenix-setup`. The image is the agent's; only this
  # service sees the answer keys. It reads .env only to see which keys are set.
  phoenix-setup:
    build:
      context: .
      dockerfile: agent/Dockerfile
    command: ["phoenix-setup"]
    env_file:
      - path: .env
        required: false
    environment:
      PHOENIX_INTERNAL_URL: http://phoenix:6006
      PHOENIX_URL: http://localhost:6006
      AGENT_URL_FOR_PHOENIX: http://agent:8000
    user: "${UID:-1000}"
    volumes:
      - ./scenarios:/app/scenarios:ro
    networks: [kind]
    depends_on:
      phoenix:
        condition: service_healthy
    restart: "no"

  phoenix:
    image: arizephoenix/phoenix:21.1.0
    # The image has no shell or curl, but it has Python.
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:6006/healthz', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 24
    environment:
      # Phoenix 21 asks for a login by default; this is a local, single-user setup.
      PHOENIX_ENABLE_AUTH: "false"
      PHOENIX_TELEMETRY_ENABLED: "false"
      # Phoenix's own OpenAI and Anthropic providers: the judge, and any model
      # you try in the Playground. Taken from .env; an unset one stays empty.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "127.0.0.1:6006:6006" # UI and OTLP over HTTP
      - "127.0.0.1:4317:4317" # OTLP over gRPC
    volumes:
      - phoenix-data:/root/.phoenix
    networks: [kind]
    restart: unless-stopped

volumes:
  phoenix-data:

networks:
  kind:
    external: true
