# The safety boundary, installed by `cluster.sh --up`.
#
# Three identities, each with only what its job needs. The API server enforces
# these rules, not the prompt: even a confused or prompt-injected agent can only
# do what its role allows.
#
#   diagnoster-reader          the agent, every investigation step (read-only)
#   diagnoster-remediator      the agent's one fix, after user approval
#   diagnoster-scenario-manager the UI backend: deploys and resets scenario workloads
#
# The scenario namespaces and their RoleBindings live here too, so the UI can
# fill namespaces with workloads but can never change who may do what.

# ---------------------------------------------------------------- identities
apiVersion: v1
kind: Namespace
metadata:
  name: diagnoster-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: diagnoster-reader
  namespace: diagnoster-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: diagnoster-remediator
  namespace: diagnoster-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: diagnoster-scenario-manager
  namespace: diagnoster-system
# ---------------------------------------------------------------- roles
---
# Read-only. Deliberately excludes Secrets and pods/exec.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: diagnoster-read
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, events, services, endpoints, configmaps]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, replicasets, statefulsets, daemonsets]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
  - apiGroups: [events.k8s.io]
    resources: [events]
    verbs: [get, list, watch]
---
# The one supported remediation: patching a single named Deployment.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: diagnoster-remediate
rules:
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [payments-api]
    verbs: [get, patch]
---
# Deploy and reset scenario workloads. No Secrets, no RBAC objects, no
# namespaces: the manager can change what runs, never who may do what.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: diagnoster-manage-scenarios
rules:
  - apiGroups: [""]
    resources: [pods, services, configmaps]
    verbs: [get, list, watch, create, update, patch, delete, deletecollection]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get, list, watch]
  # Reset clears events so the agent never investigates a previous run's history.
  - apiGroups: [""]
    resources: [events]
    verbs: [get, list, watch, deletecollection]
  - apiGroups: [apps]
    resources: [deployments, replicasets]
    verbs: [get, list, watch, create, update, patch, delete, deletecollection]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
# ---------------------------------------------------------------- scenario namespaces
# Names are neutral so the agent can't read the answer from them.
---
apiVersion: v1
kind: Namespace
metadata:
  name: shop
---
apiVersion: v1
kind: Namespace
metadata:
  name: payments
---
apiVersion: v1
kind: Namespace
metadata:
  name: catalog
---
apiVersion: v1
kind: Namespace
metadata:
  name: inventory
# ---------------------------------------------------------------- bindings
# Read access exists only in these four namespaces, never cluster-wide.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: diagnoster-read, namespace: shop}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: diagnoster-read}
subjects: [{kind: ServiceAccount, name: diagnoster-reader, namespace: diagnoster-system}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: diagnoster-read, namespace: payments}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: diagnoster-read}
subjects: [{kind: ServiceAccount, name: diagnoster-reader, namespace: diagnoster-system}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: diagnoster-read, namespace: catalog}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: diagnoster-read}
subjects: [{kind: ServiceAccount, name: diagnoster-reader, namespace: diagnoster-system}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: diagnoster-read, namespace: inventory}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: diagnoster-read}
subjects: [{kind: ServiceAccount, name: diagnoster-reader, namespace: diagnoster-system}]
---
# Remediation only where the remediation target lives.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: diagnoster-remediate, namespace: payments}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: diagnoster-remediate}
subjects: [{kind: ServiceAccount, name: diagnoster-remediator, namespace: diagnoster-system}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: diagnoster-manage-scenarios, namespace: shop}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: diagnoster-manage-scenarios}
subjects: [{kind: ServiceAccount, name: diagnoster-scenario-manager, namespace: diagnoster-system}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: diagnoster-manage-scenarios, namespace: payments}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: diagnoster-manage-scenarios}
subjects: [{kind: ServiceAccount, name: diagnoster-scenario-manager, namespace: diagnoster-system}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: diagnoster-manage-scenarios, namespace: catalog}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: diagnoster-manage-scenarios}
subjects: [{kind: ServiceAccount, name: diagnoster-scenario-manager, namespace: diagnoster-system}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: diagnoster-manage-scenarios, namespace: inventory}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: diagnoster-manage-scenarios}
subjects: [{kind: ServiceAccount, name: diagnoster-scenario-manager, namespace: diagnoster-system}]
# ---------------------------------------------------------------- field guard
# RBAC can name the one object the remediator may patch, not the one field.
# This policy is that field rule, enforced by the API server: for the
# remediator, a change to a Deployment may differ from the stored one only in
# a container's readinessProbe.httpGet.path. The agent's code allows only that
# patch too (agent/src/diagnoster/remediation.py); this holds even if that code
# or the remediator's token is misused.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: diagnoster-remediator-probe-path-only
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [apps]
        apiVersions: [v1]
        operations: [UPDATE]
        resources: [deployments]
  matchConditions:
    - name: remediator-only
      expression: "request.userInfo.username == 'system:serviceaccount:diagnoster-system:diagnoster-remediator'"
  variables:
    - name: old
      expression: oldObject.spec
    - name: new
      expression: object.spec
    - name: oldPod
      expression: oldObject.spec.template.spec
    - name: newPod
      expression: object.spec.template.spec
  validations:
    - message: "the remediator may not change the Deployment's labels, annotations, replicas, selector or rollout settings"
      expression: >-
        object.metadata.?labels == oldObject.metadata.?labels &&
        object.metadata.?annotations == oldObject.metadata.?annotations &&
        variables.new.?replicas == variables.old.?replicas &&
        variables.new.selector == variables.old.selector &&
        variables.new.?strategy == variables.old.?strategy &&
        variables.new.?minReadySeconds == variables.old.?minReadySeconds &&
        variables.new.?paused == variables.old.?paused &&
        variables.new.template.?metadata == variables.old.template.?metadata
    - message: "the remediator may not change the pod template outside its containers"
      expression: >-
        variables.newPod.?volumes == variables.oldPod.?volumes &&
        variables.newPod.?initContainers == variables.oldPod.?initContainers &&
        variables.newPod.?ephemeralContainers == variables.oldPod.?ephemeralContainers &&
        variables.newPod.?serviceAccountName == variables.oldPod.?serviceAccountName &&
        variables.newPod.?automountServiceAccountToken == variables.oldPod.?automountServiceAccountToken &&
        variables.newPod.?nodeName == variables.oldPod.?nodeName &&
        variables.newPod.?nodeSelector == variables.oldPod.?nodeSelector &&
        variables.newPod.?hostNetwork == variables.oldPod.?hostNetwork &&
        variables.newPod.?hostPID == variables.oldPod.?hostPID &&
        variables.newPod.?hostIPC == variables.oldPod.?hostIPC &&
        variables.newPod.?hostUsers == variables.oldPod.?hostUsers &&
        variables.newPod.?shareProcessNamespace == variables.oldPod.?shareProcessNamespace &&
        variables.newPod.?securityContext == variables.oldPod.?securityContext &&
        variables.newPod.?imagePullSecrets == variables.oldPod.?imagePullSecrets &&
        variables.newPod.?affinity == variables.oldPod.?affinity &&
        variables.newPod.?tolerations == variables.oldPod.?tolerations &&
        variables.newPod.?priorityClassName == variables.oldPod.?priorityClassName &&
        variables.newPod.?runtimeClassName == variables.oldPod.?runtimeClassName &&
        variables.newPod.?hostAliases == variables.oldPod.?hostAliases &&
        variables.newPod.?dnsPolicy == variables.oldPod.?dnsPolicy &&
        variables.newPod.?dnsConfig == variables.oldPod.?dnsConfig &&
        variables.newPod.?schedulerName == variables.oldPod.?schedulerName &&
        variables.newPod.?topologySpreadConstraints == variables.oldPod.?topologySpreadConstraints &&
        variables.newPod.?restartPolicy == variables.oldPod.?restartPolicy &&
        variables.newPod.?readinessGates == variables.oldPod.?readinessGates
    - message: "the remediator may change only a container's readinessProbe.httpGet.path"
      expression: >-
        variables.newPod.containers.size() == variables.oldPod.containers.size() &&
        variables.newPod.containers.all(c, variables.oldPod.containers.exists(o,
          o.name == c.name &&
          o.?image == c.?image &&
          o.?imagePullPolicy == c.?imagePullPolicy &&
          o.?command == c.?command &&
          o.?args == c.?args &&
          o.?workingDir == c.?workingDir &&
          o.?env == c.?env &&
          o.?envFrom == c.?envFrom &&
          o.?ports == c.?ports &&
          o.?volumeMounts == c.?volumeMounts &&
          o.?resources == c.?resources &&
          o.?securityContext == c.?securityContext &&
          o.?lifecycle == c.?lifecycle &&
          o.?livenessProbe == c.?livenessProbe &&
          o.?startupProbe == c.?startupProbe &&
          o.?readinessProbe.?exec == c.?readinessProbe.?exec &&
          o.?readinessProbe.?tcpSocket == c.?readinessProbe.?tcpSocket &&
          o.?readinessProbe.?grpc == c.?readinessProbe.?grpc &&
          o.?readinessProbe.?httpGet.?port == c.?readinessProbe.?httpGet.?port &&
          o.?readinessProbe.?httpGet.?host == c.?readinessProbe.?httpGet.?host &&
          o.?readinessProbe.?httpGet.?scheme == c.?readinessProbe.?httpGet.?scheme &&
          o.?readinessProbe.?httpGet.?httpHeaders == c.?readinessProbe.?httpGet.?httpHeaders &&
          o.?readinessProbe.?initialDelaySeconds == c.?readinessProbe.?initialDelaySeconds &&
          o.?readinessProbe.?periodSeconds == c.?readinessProbe.?periodSeconds &&
          o.?readinessProbe.?timeoutSeconds == c.?readinessProbe.?timeoutSeconds &&
          o.?readinessProbe.?successThreshold == c.?readinessProbe.?successThreshold &&
          o.?readinessProbe.?failureThreshold == c.?readinessProbe.?failureThreshold))
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: diagnoster-remediator-probe-path-only
spec:
  policyName: diagnoster-remediator-probe-path-only
  validationActions: [Deny]
