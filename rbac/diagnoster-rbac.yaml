# The safety boundary, installed by `cluster.sh --up`.
#
# Three identities, each with only what its job needs. The API server enforces
# these rules, not the prompt: even a confused or prompt-injected agent can only
# do what its role allows.
#
#   diagnoster-reader          the agent, every investigation step (read-only)
#   diagnoster-remediator      the agent's one fix, after user approval
#   diagnoster-scenario-manager the UI backend: deploys and resets scenario workloads
#
# The scenario namespaces and their RoleBindings live here too, so the UI can
# fill namespaces with workloads but can never change who may do what.

# ---------------------------------------------------------------- identities
apiVersion: v1
kind: Namespace
metadata:
  name: diagnoster-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: diagnoster-reader
  namespace: diagnoster-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: diagnoster-remediator
  namespace: diagnoster-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: diagnoster-scenario-manager
  namespace: diagnoster-system
# ---------------------------------------------------------------- roles
---
# Read-only. Deliberately excludes Secrets and pods/exec.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: diagnoster-read
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, events, services, endpoints, configmaps]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, replicasets, statefulsets, daemonsets]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
  - apiGroups: [events.k8s.io]
    resources: [events]
    verbs: [get, list, watch]
---
# The one supported remediation: patching a single named Deployment.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: diagnoster-remediate
rules:
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [payments-api]
    verbs: [get, patch]
---
# Deploy and reset scenario workloads. No Secrets, no RBAC objects, no
# namespaces: the manager can change what runs, never who may do what.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: diagnoster-manage-scenarios
rules:
  - apiGroups: [""]
    resources: [pods, services, configmaps]
    verbs: [get, list, watch, create, update, patch, delete, deletecollection]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get, list, watch]
  # Reset clears events so the agent never investigates a previous run's history.
  - apiGroups: [""]
    resources: [events]
    verbs: [get, list, watch, deletecollection]
  - apiGroups: [apps]
    resources: [deployments, replicasets]
    verbs: [get, list, watch, create, update, patch, delete, deletecollection]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
# ---------------------------------------------------------------- scenario namespaces
# Names are neutral so the agent can't read the answer from them.
---
apiVersion: v1
kind: Namespace
metadata:
  name: shop
---
apiVersion: v1
kind: Namespace
metadata:
  name: payments
---
apiVersion: v1
kind: Namespace
metadata:
  name: catalog
---
apiVersion: v1
kind: Namespace
metadata:
  name: inventory
# ---------------------------------------------------------------- bindings
# Read access exists only in these four namespaces, never cluster-wide.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: diagnoster-read, namespace: shop}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: diagnoster-read}
subjects: [{kind: ServiceAccount, name: diagnoster-reader, namespace: diagnoster-system}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: diagnoster-read, namespace: payments}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: diagnoster-read}
subjects: [{kind: ServiceAccount, name: diagnoster-reader, namespace: diagnoster-system}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: diagnoster-read, namespace: catalog}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: diagnoster-read}
subjects: [{kind: ServiceAccount, name: diagnoster-reader, namespace: diagnoster-system}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: diagnoster-read, namespace: inventory}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: diagnoster-read}
subjects: [{kind: ServiceAccount, name: diagnoster-reader, namespace: diagnoster-system}]
---
# Remediation only where the remediation target lives.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: diagnoster-remediate, namespace: payments}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: diagnoster-remediate}
subjects: [{kind: ServiceAccount, name: diagnoster-remediator, namespace: diagnoster-system}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: diagnoster-manage-scenarios, namespace: shop}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: diagnoster-manage-scenarios}
subjects: [{kind: ServiceAccount, name: diagnoster-scenario-manager, namespace: diagnoster-system}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: diagnoster-manage-scenarios, namespace: payments}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: diagnoster-manage-scenarios}
subjects: [{kind: ServiceAccount, name: diagnoster-scenario-manager, namespace: diagnoster-system}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: diagnoster-manage-scenarios, namespace: catalog}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: diagnoster-manage-scenarios}
subjects: [{kind: ServiceAccount, name: diagnoster-scenario-manager, namespace: diagnoster-system}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: diagnoster-manage-scenarios, namespace: inventory}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: diagnoster-manage-scenarios}
subjects: [{kind: ServiceAccount, name: diagnoster-scenario-manager, namespace: diagnoster-system}]
